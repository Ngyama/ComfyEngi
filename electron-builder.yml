appId: local.comfyengi.app
productName: ComfyEngi
directories:
  output: dist
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
win:
  target: nsis
  artifactName: ComfyEngi-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
